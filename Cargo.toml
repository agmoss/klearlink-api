[package]
name = "klearlink-api"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
diesel = { version = "2.2.7", features = ["postgres", "chrono", "numeric", "uuid"] }
dotenv = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
bigdecimal = { version = "0.4.7", features = ["serde"] }
tonic = "0.12.3"
serde_valid = "1.0.5"
uuid = { version = "1.13.0", features = ["serde", "v4"] }

[dev-dependencies]
once_cell = "1.20.3"
serial_test = "3.2.0"

[dependencies.rocket_sync_db_pools]
version = "0.1.0"
features = ["diesel_postgres_pool"]