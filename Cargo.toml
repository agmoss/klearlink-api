[package]
name = "klearlink-api"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
diesel = { version = "2.2.7", features = ["postgres"] }
dotenv = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"

[dev-dependencies]
uuid = { version = "1.4", features = ["v4"] }
once_cell = "1.18"
serial_test = "3.2.0"